# Netlify deploy config for Nuxt 4 (SSR + serverless functions)
# Docs: https://nuxt.com/deploy/netlify

[build]
  command = "pnpm run build"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "22"
  # Ensure devDependencies (icons, types) install during build
  NPM_CONFIG_PRODUCTION = "false"

[functions]
  directory = ".netlify/functions-internal"
  node_bundler = "esbuild"

# Long-lived cache for hashed Nuxt assets
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
